services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_workflow_app
    ports:
      - "3000:3000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - INNGEST_DEV=1
      - INNGEST_BASE_URL=http://inngest:8288
      - INNGEST_DEV_SERVER_URL=http://inngest:8288
      - INNGEST_SERVE_HOST=http://app:3000
      - INNGEST_EVENT_KEY=local-dev-event-key
      - INNGEST_SIGNING_KEY=local-dev-signing-key
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - inngest

  inngest:
    image: inngest/inngest:latest
    container_name: ai_workflow_inngest
    ports:
      - "8288:8288"
    command: "inngest dev -u http://app:3000/api/inngest"